<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shift Calendar">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Shift Calendar</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <button class="icon-button" id="todayBtn" aria-label="Go to today">Today</button>
        <div class="year-nav" aria-label="Year navigation">
          <button class="circle-button" id="prevYear" aria-label="Previous year">‹</button>
          <button class="year-title" id="yearTitle" aria-label="Current year"></button>
          <button class="circle-button" id="nextYear" aria-label="Next year">›</button>
        </div>
        <button class="icon-button" id="settingsBtn" aria-label="Open settings">⚙︎</button>
      </div>
      <div class="filter-row" role="group" aria-label="Shift visibility">
        <button class="filter-chip active intel" data-filter="intel">Intel</button>
        <button class="filter-chip active pfizer" data-filter="pfizer">Pfizer</button>
        <button class="filter-chip active creche" data-filter="creche">Crèche</button>
      </div>
    </header>

    <section class="summary-card" id="summaryCard">
      <div>
        <div class="eyebrow" id="summaryDateLabel">Today</div>
        <div class="summary-date" id="summaryDate"></div>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
    </section>

    <section class="calendar" id="calendar" aria-live="polite"></section>
  </main>

  <div class="sheet-backdrop hidden" id="backdrop"></div>
  <section class="bottom-sheet hidden" id="daySheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <div class="eyebrow" id="sheetWeekday"></div>
        <h2 id="sheetTitle"></h2>
      </div>
      <button class="sheet-close" data-close="true" aria-label="Close">×</button>
    </div>
    <div id="sheetBody"></div>
    <div class="sheet-actions">
      <button class="secondary-btn" id="resetOverrideBtn">Reset</button>
      <button class="primary-btn" id="saveOverrideBtn">Save</button>
    </div>
  </section>

  <section class="bottom-sheet hidden" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <div class="eyebrow">APP SETTINGS</div>
        <h2 id="settingsTitle">Settings</h2>
      </div>
      <button class="sheet-close" data-close="true" aria-label="Close">×</button>
    </div>

    <div class="settings-list">
      <label class="setting-row">
        <span><strong>Weekend emphasis</strong><small>Lightly shade Saturday and Sunday</small></span>
        <input type="checkbox" id="weekendToggle">
      </label>
      <label class="setting-row">
        <span><strong>Start with current month</strong><small>Return to today's month when opening</small></span>
        <input type="checkbox" id="currentMonthToggle">
      </label>
    </div>

    <div class="legend-card">
      <div class="legend-title">Shift legend</div>
      <div class="legend-row"><span class="legend-swatch day"></span>Day</div>
      <div class="legend-row"><span class="legend-swatch night"></span>Night</div>
      <div class="legend-row"><span class="legend-swatch off"></span>Off</div>
      <div class="legend-row"><span class="legend-swatch creche"></span>Crèche</div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
